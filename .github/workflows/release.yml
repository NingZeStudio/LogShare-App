name: Release

# 手动触发的发布流程：在两个平台上产出**已签名**的可分发产物。
#
# 为什么用 workflow_dispatch 而不是 tag push：
# 签名密钥存放在 `release` 环境（environment: release），该环境限制了只有 main 分支可部署。
# 由人工决定何时出包，避免任意推送都去消耗签名密钥。
#
# 密钥（均在 Environment `release` 下，仓库级不可见）：
#   ANDROID_KEYSTORE_BASE64      发布密钥库（base64，PKCS12）
#   ANDROID_KEYSTORE_PASSWORD    密钥库口令
#   ANDROID_KEY_ALIAS            密钥别名
#   ANDROID_KEY_PASSWORD         密钥口令
#   WINDOWS_CERT_PFX_BASE64      代码签名证书 pfx（base64）
#   WINDOWS_CERT_PASSWORD        pfx 口令

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（写入 APK versionName，并用于产物命名）
        required: true
        default: '1.0.0'
      version_code:
        description: Android versionCode（正整数，每次发布必须递增）
        required: true
        default: '1'
      android:
        description: 构建 Android 已签名 APK
        type: boolean
        default: true
      windows:
        description: 构建 Windows 已签名安装包
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # ── Android：release APK（v2 签名方案）────────────────────────
  android:
    name: Android 已签名 APK
    if: ${{ inputs.android }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # gradle-wrapper.properties 指向腾讯云镜像（国内加速），海外 runner 拉取不可靠
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      # 密钥库与 key.properties 只存在于本次运行的临时工作区，绝不入库
      - name: 还原签名材料
        working-directory: frontend/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > logshare-release.jks
          {
            echo "storeFile=logshare-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
          echo "密钥库已还原（$(wc -c < logshare-release.jks) 字节），key.properties 已生成"

      - name: 构建 web 产物
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # 必须 sync（= copy + update）而非 copy：capacitor-cordova-android-plugins/
      # 是被 gitignore 的生成物，全新检出时不存在，仅 copy 会让 gradle 评估阶段失败
      - name: 同步原生产物
        working-directory: frontend
        run: pnpm exec cap sync android

      - name: 构建 release APK
        working-directory: frontend/android
        run: >-
          gradle --no-daemon
          -PappVersionCode=${{ inputs.version_code }}
          -PappVersionName=${{ inputs.version }}
          assembleRelease

      # 缺 key.properties 时 gradle 会静默产出未签名 APK —— verify 会让它现形
      - name: 校验签名
        working-directory: frontend/android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          echo "APK 已签名并校验通过"

      # 必须用块标量而非 `run: cmd \` 续行：YAML 单行标量会把换行折叠成
      # 转义空格，命令会变成 `cp a " b"` —— 目标文件名多一个前导空格，
      # cp 照样成功退出，但产物名与预期不符，上传时才报找不到文件。
      - name: 归档产物
        run: |
          OUT="LogShare-${{ inputs.version }}-release.apk"
          cp frontend/android/app/build/outputs/apk/release/app-release.apk "$OUT"
          ls -lh "$OUT"

      - name: 清理签名材料
        if: always()
        working-directory: frontend/android
        run: rm -f key.properties logshare-release.jks

      - uses: actions/upload-artifact@v4
        with:
          # 用大写 LogShare 前缀：密钥值 ANDROID_KEY_ALIAS 为小写 "logshare"，
          # GitHub 会把日志/UI 里出现的该字符串统一打码成 ***，产物名会被显示成
          # "***-release-apk"，徒增困惑
          name: LogShare-release-apk
          path: LogShare-${{ inputs.version }}-release.apk
          if-no-files-found: error
          retention-days: 30

  # ── Windows：签名安装包 / 便携版 ──────────────────────────────
  windows:
    name: Windows 已签名安装包
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 构建 web 产物
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 安装壳层依赖
        working-directory: electron
        run: npm ci

      # electron-builder 用 package.json 的 version 命名产物，
      # 注入后预发布产物名才会带 -rc/-beta 后缀；不回写仓库
      - name: 注入版本号
        working-directory: electron
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: 还原代码签名证书
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          New-Item -ItemType Directory -Force -Path "electron/build/certs" | Out-Null
          $pfx = Join-Path $env:GITHUB_WORKSPACE "electron/build/certs/codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_BASE64))
          "证书已还原: $((Get-Item $pfx).Length) 字节"

      # electron-builder 直接读 CSC_LINK + CSC_KEY_PASSWORD，
      # 默认已用 SHA-256 + DigiCert RFC3161 时间戳，无需改 package.json
      - name: 打包并签名
        working-directory: electron
        env:
          CSC_LINK: ${{ github.workspace }}/electron/build/certs/codesign.pfx
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: npx electron-builder --win

      # 自签证书的 Status 会是 UnknownError（链终止于不受信任的自签根），
      # 这是自签的固有属性；换成 CA 签发的 OV/EV 证书后即为 Valid。
      # 因此这里只断言「确实签上了」，不断言「受信任」。
      - name: 校验 Authenticode 签名
        shell: pwsh
        run: |
          $exes = Get-ChildItem "dist/*.exe"
          if (-not $exes) { throw "dist 下没有 exe 产物" }
          $unsigned = 0
          foreach ($f in $exes) {
            $s = Get-AuthenticodeSignature -FilePath $f.FullName
            $stamp = if ($s.TimeStamperCertificate) { "有" } else { "无" }
            "{0,-42} {1,-14} 时间戳={2}" -f $f.Name, $s.Status, $stamp
            if ($s.Status -eq 'NotSigned') { $unsigned++ }
          }
          if ($unsigned -gt 0) { throw "$unsigned 个 exe 未签名 —— CSC_LINK / CSC_KEY_PASSWORD 未生效" }
          "全部 exe 均已签名"

      - name: 清理签名材料
        if: always()
        shell: pwsh
        run: Remove-Item -Force "electron/build/certs/codesign.pfx" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: LogShare-windows-${{ inputs.version }}
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 30

  # ── 汇总产物并创建预发布 Release ──────────────────────────────
  # 独立成 job 是为了让 contents: write 只出现在这一步，
  # 上游构建 job 仍维持 contents: read 的最小权限。
  publish:
    name: 创建预发布 Release
    needs: [android, windows]
    # 任一平台失败/取消则不发布；两个都跳过也不发布
    if: >-
      ${{ always()
          && needs.android.result != 'failure'
          && needs.android.result != 'cancelled'
          && needs.windows.result != 'failure'
          && needs.windows.result != 'cancelled'
          && (needs.android.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理发布产物
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.apk' -o -name '*.exe' \) ! -name '*.blockmap' \
            -exec cp {} release-assets/ \;
          echo "待发布文件："
          ls -lh release-assets/

      # 用带占位符的引号 heredoc 再 sed 替换，避免反引号/变量在 shell 里被意外展开
      - name: 生成 Release 说明
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cat > notes.md <<'EOF'
          ## LogShare v__VERSION__（预发布）

          > ⚠️ **预发布版本**：功能与签名链路已跑通，但尚未完成真机回归，请勿用于生产环境。

          ### 产物

          | 平台 | 文件 | 说明 |
          |---|---|---|
          | Android | `LogShare-__VERSION__-release.apk` | 已签名（v2 方案），minSdk 24（Android 7.0+） |
          | Windows | `LogShare Setup __VERSION__.exe` | NSIS 安装包 |
          | Windows | `LogShare __VERSION__.exe` | 便携版，免安装 |

          ### 签名说明

          - **Android**：已用发布密钥库签名，构建流程内 `apksigner verify` 校验通过
          - **Windows**：当前使用**自签证书**，首次运行仍会触发 SmartScreen 提示；待换用 CA 签发的 OV/EV 证书后即消除（签名管线本身已验证可用）

          ### 校验方式

          ```bash
          # Android
          apksigner verify --print-certs LogShare-__VERSION__-release.apk

          # Windows（PowerShell）
          Get-AuthenticodeSignature "LogShare Setup __VERSION__.exe"
          ```
          EOF
          sed -i "s/__VERSION__/${VERSION}/g" notes.md
          echo "说明已生成（$(wc -l < notes.md) 行）"

      - name: 创建预发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "LogShare v${VERSION}（预发布）" \
            --notes-file notes.md \
            --prerelease \
            release-assets/*
