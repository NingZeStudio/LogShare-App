<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 内容安全策略：禁止加载/执行外部与内联脚本，仅允许访问 LogShare 公共 API
         显式列出 file: 以兼容 Electron 打包后由 file:// 加载本地资源 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self' 'wasm-unsafe-eval' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: file:; font-src 'self' data: file:; connect-src 'self' https://api.logshare.cn https://localhost http://localhost:* ws://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- viewport-fit=cover：让 env(safe-area-inset-*) 在刘海屏/手势条设备上生效 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA：可添加到主屏幕、独立窗口运行 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LogShare" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no,email=no,address=no" />

    <!-- 浏览器 UI 配色：跟随明暗模式切换 -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />

    <title>LogShare.CN - Minecraft 日志分享与分析平台</title>

    <!-- 基础 SEO -->
    <meta name="description" content="轻松上传、分享和分析 Minecraft/Hytale 服务器日志。AI 智能分析，快速定位问题，提供解决方案。" />
    <meta name="keywords" content="Minecraft, 日志, 分析, 分享, 服务器, 崩溃报告, AI 分析, Hytale, MC 服务器" />

    <!-- Open Graph / 社交元数据 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LogShare.CN - Minecraft 日志分享与分析" />
    <meta property="og:description" content="轻松上传、分享和分析 Minecraft/Hytale 服务器日志。AI 智能分析，快速定位问题，提供解决方案。" />
    <meta property="og:image" content="/icons/icon-512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="LogShare.CN - Minecraft 日志分享与分析" />
    <meta name="twitter:description" content="轻松上传、分享和分析 Minecraft/Hytale 服务器日志。AI 智能分析，快速定位问题，提供解决方案。" />
    <meta name="twitter:image" content="/icons/icon-512.png" />

    <!-- QQ 分享元标签 -->
    <meta name="qq:share:title" content="LogShare.CN - Minecraft 日志分享与分析" />
    <meta name="qq:share:description" content="轻松上传、分享和分析 Minecraft/Hytale 服务器日志。AI 智能分析，快速定位问题，提供解决方案。" />
    <meta name="qq:share:image" content="/icons/icon-512.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
